<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مامۆستا ئیمان شێخانی | بیرکاری</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#071a35,#0d2d55);
  color:white;
  min-height:100vh;
}

.container{
  max-width:500px;
  margin:auto;
  padding:25px 18px;
}

.header{
  text-align:center;
  padding:30px 10px;
}

.math-icon{
  font-size:55px;
  margin-bottom:12px;
}

h1{
  font-size:25px;
  color:#f5c542;
  margin-bottom:10px;
}

.subtitle{
  color:#d7e3f4;
  font-size:15px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:25px 20px;
  margin-top:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

label{
  display:block;
  margin-bottom:10px;
  color:#f5c542;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:13px;
  outline:none;
  font-size:16px;
  text-align:right;
  background:white;
  color:#111;
}

button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:none;
  border-radius:13px;
  background:#f5c542;
  color:#071a35;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.info{
  margin-top:22px;
  line-height:2;
  color:#d7e3f4;
  font-size:14px;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#9fb3ca;
  font-size:12px;
}

.hidden{
  display:none;
}

.question{
  font-size:20px;
  line-height:1.8;
  margin-bottom:18px;
  text-align:center;
}

.success{
  text-align:center;
  color:#72e6a5;
  line-height:2;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="math-icon">📐</div>

    <h1>مامۆستا ئیمان شێخانی</h1>

    <div class="subtitle">
      بیرکاری • سیستەمی تاقیکردنەوە
    </div>
  </div>

  <!-- Student Login -->
  <div class="card" id="login">

    <label>👨‍🎓 ناوی قوتابی</label>

    <input
      id="studentName"
      type="text"
      placeholder="ناوت لێرە بنووسە..."
    >

    <button onclick="startQuiz()">
      ▶ دەستپێکردن
    </button>

    <div class="info">
      📝 ناوت بنووسە بۆ دەستپێکردنی پرسیارەکە.<br>
      🔒 وەڵامەکانت بۆ مامۆستا دەنێردرێن.
    </div>

  </div>

  <!-- Quiz -->
  <div class="card hidden" id="quiz">

    <div class="question">
      🧮 پرسیاری بیرکاری
      <br><br>
      5 + 7 = ؟
    </div>

    <input
      id="answer"
      type="number"
      placeholder="وەڵامەکەت بنووسە..."
    >

    <button onclick="submitAnswer()">
      📤 ناردنی وەڵام
    </button>

  </div>

  <!-- Success -->
  <div class="card hidden" id="success">

    <div class="success">

      ✅ وەڵامەکەت بە سەرکەوتوویی نێردرا!

      <br><br>

      سوپاس بۆ بەشداریکردنت 🌟

      <br><br>

      مامۆستا دواتر وەڵامەکەت هەڵدەسەنگێنێت.

    </div>

  </div>

  <div class="footer">
    © مامۆستا ئیمان شێخانی | بیرکاری
  </div>

</div>

<script>

function startQuiz(){

  const name =
    document.getElementById("studentName").value.trim();

  if(name === ""){
    alert("تکایە ناوت بنووسە.");
    return;
  }

  document.getElementById("login")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.remove("hidden");
}


function submitAnswer(){

  const answer =
    document.getElementById("answer").value.trim();

  if(answer === ""){
    alert("تکایە وەڵامەکەت بنووسە.");
    return;
  }

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("success")
    .classList.remove("hidden");
}

</script>

</body>
</html>
